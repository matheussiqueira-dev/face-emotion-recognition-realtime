services:
  emotionai:
    build: .
    image: emotionai:latest
    ports:
      # Bound to localhost only: API tokens are empty by default.
      - "127.0.0.1:${HOST_PORT:-8001}:8000"
    environment:
      EMOTION_VIDEO_SOURCE: /videos/${VIDEO_FILE:-Face-emotions.mp4}
      EMOTION_API_READ_TOKEN: ${EMOTION_API_READ_TOKEN:-}
      EMOTION_API_ADMIN_TOKEN: ${EMOTION_API_ADMIN_TOKEN:-}
    volumes:
      - ${VIDEO_DIR:-.}:/videos:ro
      - deepface-models:/models

volumes:
  deepface-models:
