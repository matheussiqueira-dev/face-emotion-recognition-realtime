# Vercel's Python builder installs from this table (`uv lock` fails without it). pip, CI and Docker use the
# requirements files; tests/test_packaging.py keeps `dependencies` equal to requirements.in.
[project]
name = "emotionai-realtime"
version = "2.1.0"
description = "Real-time facial expression recognition with FastAPI, OpenCV and DeepFace."
# Upper bound is deliberate: Vercel picks the newest allowed Python, and tensorflow 2.21 ships cp313 wheels only.
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "opencv-contrib-python-headless==4.14.0.94",
    "numpy==2.5.4",
    "Pillow==12.3.0",
    "deepface==0.0.102",
    "tf-keras==2.21.0",
    "fastapi==0.143.3",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "websockets==17.2",
]

# Vercel only auto-detects `app` in files such as main.py/app.py; main.py here is the legacy
# OpenCV window wrapper, so point the FastAPI preset at the real application factory module.
[tool.vercel]
entrypoint = "app.backend.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = ["app/core/config.py", "app/core/models.py", "app/core/tracker.py", "app/core/pipeline.py"]
