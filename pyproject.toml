[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = ["app/core/config.py", "app/core/models.py", "app/core/tracker.py", "app/core/pipeline.py"]
